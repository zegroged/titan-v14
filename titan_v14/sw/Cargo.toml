[workspace]
resolver = "2"
members = [
    "hidra_core",
    "hidra_net",
    "hidra_ui",
    "hidra_sim",
    "hidra_e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["PROJECT HİDRA"]
license = "Proprietary"

[workspace.dependencies]
# Cryptography
aes-gcm-siv = "0.11"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
pqcrypto-kyber = "0.8"
pqcrypto-traits = "0.3"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1.7", features = ["derive"] }
subtle = "2.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Async
tokio = { version = "1.36", features = ["full"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Networking
rumqttc = "0.24"
tokio-socks = "0.5"

# Utilities
base64 = "0.22"
hmac = "0.12"
aes = "0.8"
ctr = "0.9"
libc = "0.2"
